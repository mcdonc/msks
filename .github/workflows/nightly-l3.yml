# The L3 recursion proving smoke (#135) on demand —
# test_appliance_l3_recursion (#82), the host -> appliance ->
# workspace -> inner-workspace recursion, on the self-hosted
# KVM runner. Manual dispatch only: no schedule is armed until a
# runner labeled msks-l3 actually registers — a scheduled run
# with no runner would sit queued forever and signal nothing.
#
# Why self-hosted: the proving smoke needs two levels of nesting
# *below* the runner (vmx in the workspace, so the inner workspace
# can run KVM). GitHub's hosted runners expose /dev/kvm for exactly
# one nesting level — the local smokes' workspaces (smoke.yml's
# header) — and the appliance's own workspaces already sit beyond
# it. Azure does not accelerate the depth this test proves, so the
# nightly runs where that depth exists: a registered self-hosted
# runner labeled `msks-l3` (the dev host's shape: /dev/kvm, the
# one-time `scripts/appliance-host-setup.sh` network install, and
# nix for both asset builds — README "Appliance" section documents
# the pieces). No `msks-l3` runner is registered yet, so this
# workflow carries no `schedule:`. Re-arm the nightly by adding
# the trigger back once the runner is live and `workflow_dispatch`
# has validated one clean end-to-end run.
#
# Not per-PR: the sequence costs tens of minutes on a warm cache
# (its phase timeline is narrated in the run log — #82's evidence
# holds the reference numbers), needs the runner's network to
# itself (the appliance claims the msksbr0 bridge), and touches
# state (a built .guest/ and .appliance/) that per-PR runs would
# fight over. When the schedule returns, its cadence bounds the
# recursion's silent-rot window to a day; a red run is the alarm,
# and the timeline in its log is the triage.
name: L3 recursion smoke (self-hosted)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # The proving smoke is serial and exclusive: the appliance claims
  # the runner's network and state.
  group: l3-recursion
  cancel-in-progress: true

jobs:
  l3-recursion:
    runs-on: [self-hosted, msks-l3]
    timeout-minutes: 150
    steps:
      # The runner service's PATH is minimal; the devenv (and git,
      # for the checkout) live in the runner user's nix profile.
      # Preceding checkout: the checkout step needs that PATH too.
      - name: Put the nix profile on PATH
        run: echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v5

      # Inside the devenv shell — the same environment the prove
      # step runs in — so `ip`, `ssh`, and `rsync` resolve the way
      # the test itself resolves them, not by the runner's ambient
      # PATH luck.
      # Fail on the first missing piece, named — no accumulation,
      # no shell variables inside the single-quoted script. The
      # devenv check stays OUTSIDE the devenv wrapper: a missing
      # devenv names itself here rather than dying as a bare
      # command-not-found under the wrapper.
      - name: Check prerequisites
        run: |
          command -v devenv >/dev/null \
            || { echo "devenv not on PATH (~/.nix-profile/bin)"; exit 1; }
          devenv --quiet -O dotenv.enable:bool false shell -- bash -c '
          command -v ssh >/dev/null || { echo "ssh not on PATH (the recursion rsync leg)"; exit 1; }
          command -v rsync >/dev/null || { echo "rsync not on PATH (the recursion rsync leg)"; exit 1; }
          [ -w /dev/kvm ] || { echo "/dev/kvm missing or not writable"; exit 1; }
          ip link show msksbr0 >/dev/null 2>&1 || { echo "msksbr0 missing (one-time: sudo bash scripts/appliance-host-setup.sh)"; exit 1; }
          echo "prerequisites: all present"
          '

      # Idempotent, cached after the first run: nix keeps the guest
      # toolchain and the appliance image's build inputs in the
      # store, so a warm nightly pays only the copy-out. Building
      # here (not in the test) keeps the prove step's own timeline
      # clean of build noise.
      - name: Build appliance and guest assets
        run: >-
          devenv --quiet -O dotenv.enable:bool false shell --
          devenv tasks run msks:appliance-build msks:build-guest

      # The proving smoke, exactly the documented dev-host
      # invocation, with one CI-specific guard: the test's skip
      # guards (needs_l3) skip — not fail — when a prerequisite is
      # missing, and a nightly that quietly skips would report
      # green while proving nothing. -rs surfaces every skip
      # reason, the tee keeps the timeline in the step log, and the
      # closing grep turns any skip (or an empty collection) into a
      # red run. The test owns its per-phase budgets and the
      # whole-sequence wall (its own 5400s default — the phases
      # finished inside ~330s idle-host; the budget absorbs a
      # loaded runner's slower nested boots, and the job wall
      # leaves room for it beside the build).
      - name: L3 recursion smoke
        env:
          MSKSD_TEST_APPLIANCE: "1"
          MSKSD_TEST_L3: "1"
        run: |
          set -o pipefail
          TMPDIR=/tmp devenv --quiet -O dotenv.enable:bool false shell -- \
            python -m pytest \
            src/msks/tests/test_smoke/test_l3_recursion.py::test_appliance_l3_recursion \
            -q -rs -p no:cacheprovider --no-cov 2>&1 \
            | tee /tmp/nightly-l3-pytest.log
          ! grep -qE '^SKIPPED|no tests ran' /tmp/nightly-l3-pytest.log

      # The failure paths' own evidence: the appliance's three logs
      # (serial, VMM, virtiofsd — scripts/appliance-run.sh's
      # outputs). The L3 test narrates its phases to the step log
      # rather than collecting to /tmp/msks-smoke-failed/ (that
      # path belongs to the L1/L2 smokes' collector). The
      # self-hosted workspace persists, but the artifact makes the
      # red run legible from the run page itself. Runs on
      # cancellation too — the sequence is long enough that the job
      # wall can cut it mid-probe, and that cut is exactly when the
      # evidence matters.
      - name: Collect smoke state on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-l3-failure-evidence
          path: |
            .appliance/serial.log
            .appliance/cloud-hypervisor.log
            .appliance/virtiofsd.log
          if-no-files-found: ignore
          retention-days: 14

      # Orphan recovery, after the evidence upload so it never
      # destroys the logs it guards. The test starts the appliance
      # through the detached devenv supervisor; a cancelled or
      # wall-cut run never reaches the test's teardown, and the
      # orphan VMM keeps the bridge tap, the guest IP, and its
      # memory — poisoning every later night (the next run's
      # checkout cleans .appliance/ including api.sock, so the
      # test's stomp guard sees nothing while the VMM still
      # answers). This is the recovery the repo documents for
      # exactly that shape: graceful down first, then the named
      # pkill patterns, then the stale sockets. always() — a green
      # run's down is the clean no-op the supervisor contract
      # promises.
      - name: Ensure appliance is down
        if: always()
        run: |
          devenv --quiet -O dotenv.enable:bool false shell -- bash -c '
          devenv tasks run msks:appliance-down || true
          pkill -f "cloud-hypervisor --api-socket.*.appliance/api.sock" || true
          pkill -f "virtiofsd --socket-path.*.appliance" || true
          rm -f .appliance/api.sock .appliance/vsock.sock .appliance/run.pid
          echo "appliance teardown: clean"
          '
