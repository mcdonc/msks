# Real-VM smoke tests on the hosted runner (#64).
#
# GitHub-hosted Linux runners expose /dev/kvm with hardware
# acceleration (changelog 2024-04-02: available on the standard
# 2-vCPU runners once the runner user gets access via a udev rule),
# so the KVM-gated local smoke tests — boots a real workspace VM
# through cloud-hypervisor — no longer need to skip in CI. The runner
# VM itself is L1 on Azure metal; the workspace VM is L2, which is
# exactly the one nesting level Azure's nested virt supports.
#
# What stays out: the appliance smoke test (MSKSD_TEST_APPLIANCE) —
# its workspace boots inside the appliance VM, a third level (L3)
# Azure does not accelerate — and the k8s smoke (needs a cluster).
# Both remain dev-host-only, opt-in exactly as before.
#
# Path-filtered to its real inputs: the guest/toolchain files (a
# nixpkgs pin move lands through devenv.lock), everything under the
# server package the boots exercise, and the tests themselves. That
# is most code PRs — deliberate: this is the only real-VM coverage
# the repo has until #9's QEMU driver, and ~5 minutes of runner time
# is cheaper than a green-but-cannot-boot merge.
name: Smoke (KVM)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/smoke.yml
      - devenv.nix
      - devenv.yaml
      - devenv.lock
      - nix/guest.nix
      - nix/guest-assets.nix
      - scripts/build-guest.sh
      - src/msks/msks/**
      - src/msks/tests/conftest.py
      - src/msks/tests/test_smoke.py
  pull_request:
    paths:
      - .github/workflows/smoke.yml
      - devenv.nix
      - devenv.yaml
      - devenv.lock
      - nix/guest.nix
      - nix/guest-assets.nix
      - scripts/build-guest.sh
      - src/msks/msks/**
      - src/msks/tests/conftest.py
      - src/msks/tests/test_smoke.py

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-kvm:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: devenv

      # Pinned release, not the moving default registry: the devenv
      # that evaluates the 2.x tasks syntax and parses -O is the one
      # moving part otherwise — an upstream break would red CI with no
      # repo change.
      - name: Install devenv.sh
        run: nix profile add github:cachix/devenv/v2.3.1

      # The documented KVM permission rule (github.blog 2024-04-02):
      # /dev/kvm exists on the hosted runner image but is restricted;
      # this makes it 0666 for the runner user. kvm_available() then
      # passes and the conftest points the smoke tests at the built
      # .guest/ artifacts.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build guest assets
        run: >-
          devenv --quiet -O dotenv.enable:bool false shell --
          devenv tasks run msks:build-guest

      # The smoke suite never counts toward the coverage gate (the
      # faked-transport unit suites own the 100%); serial (-n auto
      # stays off) so the two real boots do not fight over the
      # runner's 2 vCPUs. TMPDIR=/tmp for the same AF_UNIX path-depth
      # reason as ci.yml; the tests keep their own shallow
      # /tmp/msks-smoke-* state dirs.
      # Nested-KVM guests run the same boots several times slower
      # than a dev host's KVM guest (#64): give each phase of the
      # persistence test's four boot cycles generous ceilings. The
      # dev-host defaults live in the test module.
      - name: Smoke tests
        env:
          TMPDIR: /tmp
          MSKSD_TEST_GUEST_UP_TIMEOUT_S: "180"
          MSKSD_TEST_CONSOLE_TIMEOUT_S: "120"
          MSKSD_TEST_SHUTDOWN_TIMEOUT_S: "180"
        run: >-
          devenv --quiet -O dotenv.enable:bool false shell --
          python -m pytest src/msks/tests/test_smoke.py
          -q -p no:cacheprovider --no-cov

      # The egress smoke (#52) needs root — tap/nft/DHCP/DNS — and
      # nftables, which the runner image does not preinstall. Run it
      # under sudo with the devenv shell's PATH (the test resolves
      # the ip/nft tools through it), serial and after the unprivileged
      # smokes so a failure there is not mistaken for this one. Nested
      # KVM boots are slow; the phase timeouts apply here too.
      # This step guards the bare-host posture — msksd's net stack on
      # a kernel it shares with other firewall owners — which the
      # appliance does not exercise (msksd is the only firewall in
      # its kernel) and which nothing ships today: retire this step
      # if k8s workspace egress (#69) settles on pod networking, keep
      # and promote it if it lands on host taps — the additive
      # appliance-side coverage is #88. Either way the
      # lesson it pins is the product lesson for that posture: an
      # nft accept in the daemon's own tables cannot override a
      # foreign base chain's drop — on a shared kernel, host firewall
      # control must be taken explicitly, the way appliance-setup.sh
      # takes it for the appliance bridge. Concretely here: the
      # runner's docker leaves FORWARD policy DROP for traffic not
      # its own, so the smoke prints whatever the image left behind,
      # clears FORWARD, and hands the forward hook to the daemon's
      # own nft tables — the rules this smoke exists to test. Without
      # that, guest TCP out blackholes behind docker's policy while
      # DHCP and DNS (host-terminated, input chain) pass; validated
      # against a faithful FORWARD policy-drop simulation during #75.
      # The runner is a per-job VM, so the flush and policy travel
      # with it and touch no other workload.
      - name: Egress smoke forwarding precondition
        run: |
          echo "::group::forward/firewall state before"
          sysctl net.ipv4.ip_forward
          sudo iptables -S FORWARD || true
          sudo nft list tables || true
          echo "::endgroup::"
          sudo iptables -F FORWARD
          sudo iptables -P FORWARD ACCEPT
          sudo iptables -S FORWARD

      - name: Egress smoke (root)
        env:
          TMPDIR: /tmp
          MSKSD_TEST_GUEST_UP_TIMEOUT_S: "180"
          MSKSD_TEST_CONSOLE_TIMEOUT_S: "120"
          MSKSD_TEST_SHUTDOWN_TIMEOUT_S: "180"
        run: >-
          sudo apt-get update -qq && sudo apt-get install -y -qq nftables &&
          devenv --quiet -O dotenv.enable:bool false shell -- bash -c "
          sudo -n env MSKSD_TEST_EGRESS=1 TMPDIR=/tmp
          MSKSD_TEST_GUEST_UP_TIMEOUT_S=180
          MSKSD_TEST_CONSOLE_TIMEOUT_S=120
          MSKSD_TEST_SHUTDOWN_TIMEOUT_S=180
          MSKSD_TEST_SSH_TIMEOUT_S=120
          PATH=\"\$PATH\" HOME=/root
          python -m pytest src/msks/tests/test_smoke.py::test_local_egress_boot
          src/msks/tests/test_smoke.py::test_local_sshd_and_rsync
          src/msks/tests/test_smoke.py::test_local_minted_identity
          -q -p no:cacheprovider --no-cov"

      # The failing boot's own evidence, kept by the tests' failure
      # path (serial log, VMM log, raw vsock probe printed in the step
      # log) — the runner recycles, so /tmp/msks-smoke-failed/ is the
      # only place the guest's side of the story survives. Runs on
      # cancellation too (#75 review): the console retries can now
      # spend long enough on a wedged guest to hit the job wall, and
      # `failure()` alone is false on a timeout cancel — losing the
      # evidence exactly when it is most needed.
      - name: Collect smoke state on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-evidence
          path: /tmp/msks-smoke-failed/
          if-no-files-found: ignore
          retention-days: 7
