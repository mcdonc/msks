# CI: the authoritative unit-test run (#6, split to tests-only in #17).
#
# Everything runs inside the devenv shell built from this repo's
# devenv.nix/devenv.yaml — the same pinned nixpkgs, the same uv venv,
# the same cloud-hypervisor as every contributor gets — so a green run
# here means the dev environment itself is healthy too.
#
# Lint/xenon (lint.yml) and the guest-asset build (guest-assets.yml)
# are now their own workflows: each reports as its own check and none
# can mask the others, which is what the old `if: !cancelled()`
# chaining approximated inside a single job.
#
# The real-VM smoke tests run in smoke.yml — the hosted runner's
# /dev/kvm (changelog 2024-04-02) plus the built guest assets
# (.devenv/state/guest) satisfy the local suite's gate (#64); the
# k8s smokes stay dev-host opt-in. This workflow stays MSKSD_TEST_*-free by
# design: coverage-gated units only.
name: CI

# Markdown-only changes cannot move the gates (ruff/xenon read src/,
# the unit tests exercise code) — so an .md-only push skips both runs
# instead of burning a runner. guest-assets.yml already path-filters
# to its own inputs.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: devenv

      # Pinned release, not the moving default registry: the devenv
      # that evaluates the 2.x tasks syntax and parses -O is the one
      # moving part otherwise — an upstream break would red CI with no
      # repo change.
      - name: Install devenv.sh
        run: nix profile add github:cachix/devenv/v2.3.1

      # The CI-identical invocation (AGENTS.md): pytest -n auto with
      # coverage flags from pyproject addopts, COVERAGE_CORE=sysmon
      # pinned by conftest, fail_under = 100 branch coverage. The
      # runner's TMPDIR nests deep enough to push AF_UNIX socket paths
      # past the 108-byte limit; pytest's basetemp belongs under /tmp
      # (belt to the fixtures' shallow state dirs).
      - name: Unit tests
        env:
          TMPDIR: /tmp
        run: >-
          devenv --quiet -O dotenv.enable:bool false shell --
          unit-tests
