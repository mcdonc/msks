# The NixOS real-VM smoke suite (#250): the same unprivileged core
# suite as smoke-debian.yml, booted against the NixOS guest — the
# explicit TEST_* exports override the conftest's discovered
# Debian defaults. Its own workflow so the image's lane reports
# separately and runs in parallel with the Debian lane.
#
# The cold build is the long pole (the closure is all
# cache.nixos.org downloads plus msks's own pack steps); the suite
# itself matches the Debian lane's shape — serial, verbose, guarded
# against a run that quietly skipped everything.
name: Smoke (NixOS)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/smoke-nixos.yml
      - devenv.nix
      - devenv.yaml
      - devenv.lock
      - nix/guest.nix
      - nix/guest-pi-extension.ts
      - nix/agent-toolchain.nix
      - nix/pi-shrinkwrap-patch.py
      - nix/pi-shrinkwrap-integrity.json
      - nix/guest-nixos.nix
      - nix/guest-nixos-configuration.nix
      - nix/console-helper-pkg.nix
      - nix/image-archive.nix
      - scripts/build-guest.sh
      - src/msks/msks/**
      - src/msks/tests/conftest.py
      - src/msks/tests/test_smoke/__init__.py
      - src/msks/tests/test_smoke/*.py
      - src/msks/tests/test_smoke/core/**
      - src/msks/tests/test_smoke/egress/test_probe_e2e.py
  pull_request:
    paths:
      - .github/workflows/smoke-nixos.yml
      - devenv.nix
      - devenv.yaml
      - devenv.lock
      - nix/guest.nix
      - nix/guest-pi-extension.ts
      - nix/agent-toolchain.nix
      - nix/pi-shrinkwrap-patch.py
      - nix/pi-shrinkwrap-integrity.json
      - nix/guest-nixos.nix
      - nix/guest-nixos-configuration.nix
      - nix/console-helper-pkg.nix
      - nix/image-archive.nix
      - scripts/build-guest.sh
      - src/msks/msks/**
      - src/msks/tests/conftest.py
      - src/msks/tests/test_smoke/__init__.py
      - src/msks/tests/test_smoke/*.py
      - src/msks/tests/test_smoke/core/**

permissions:
  contents: read

concurrency:
  group: smoke-nixos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-nixos:
    runs-on: ubuntu-latest
    # 25 held the core lane alone; the probe e2e boots a daemon
    # and a guest beside it.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: devenv

      - name: Install devenv.sh
        run: nix profile add github:cachix/devenv/v2.3.1

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the NixOS guest assets
        run: >-
          devenv --quiet -O dotenv.enable:bool false shell --
          msks-build-guest nixos

      - name: Smoke tests
        env:
          TMPDIR: /tmp
          TEST_GUEST_UP_TIMEOUT_S: "180"
          TEST_CONSOLE_TIMEOUT_S: "120"
          TEST_SHUTDOWN_TIMEOUT_S: "180"
        run: |
          set -o pipefail
          G=.devenv/state/guest-nixos
          manifest="$G/guest-manifest.json"
          cmdline=$(
            python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['cmdline'])" \
              "$manifest"
          )
          devenv --quiet -O dotenv.enable:bool false shell -- env \
            TEST_VMLINUX="$PWD/$G/vmlinux" \
            TEST_INITRD="$PWD/$G/initrd" \
            TEST_ROOTFS="$PWD/$G/rootfs.ext4" \
            TEST_CMDLINE="$cmdline" \
            python -m pytest src/msks/tests/test_smoke/core \
            -v -rs -p no:cacheprovider --no-cov 2>&1 \
            | tee /tmp/smoke-nixos.log
          ! grep -q 'test_boot_lifecycle.*SKIPPED' /tmp/smoke-nixos.log \
            || {
              echo 'the NixOS boots skipped — assets or /dev/kvm regressed'
              exit 1
            }

      # The probe e2e against the NixOS image (#424): the same
      # root+egress shape the Debian egress lane runs, against the
      # NixOS guest — the daemon boots that image unchanged, the
      # seed's CA staging rides the NixOS paths (the staged bundle
      # and the profile.local exports), and curl (an image package
      # here) verifies against the seed's bundle.
      - name: Probe e2e (root)
        run: |
          set -o pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq nftables
          G=.devenv/state/guest-nixos
          manifest="$G/guest-manifest.json"
          cmdline=$(
            python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['cmdline'])" \
              "$manifest"
          )
          IMG="$PWD/$G"
          devenv --quiet -O dotenv.enable:bool false shell -- bash -c "
          sudo -n env TEST_EGRESS=1 TMPDIR=/tmp \
            GUEST_DIR='$IMG' \
            TEST_VMLINUX='$IMG/vmlinux' \
            TEST_INITRD='$IMG/initrd' \
            TEST_ROOTFS='$IMG/rootfs.ext4' \
            TEST_CMDLINE='$cmdline' \
            PATH=\"\$PATH\" HOME=/root \
            python -m pytest src/msks/tests/test_smoke/egress/test_probe_e2e.py \
            -v -rs -p no:cacheprovider --no-cov 2>&1 | tee /tmp/smoke-nixos-e2e.log
          "
          ! grep -q 'test_probe_e2e.*SKIPPED' /tmp/smoke-nixos-e2e.log

      - name: Collect smoke state on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-nixos-evidence
          path: /tmp/msks-smoke-failed/
          if-no-files-found: ignore
          retention-days: 7
