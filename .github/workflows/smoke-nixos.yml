# The NixOS real-VM smoke suite (#250): the same unprivileged core
# suite as smoke-debian.yml, booted against the NixOS guest — the
# explicit MSKSD_TEST_* exports override the conftest's discovered
# Debian defaults. Its own workflow so the image's lane reports
# separately and runs in parallel with the Debian lane.
#
# The cold build is the long pole (the closure is all
# cache.nixos.org downloads plus msks's own pack steps); the suite
# itself matches the Debian lane's shape — serial, verbose, guarded
# against a run that quietly skipped everything.
name: Smoke (NixOS)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/smoke-nixos.yml
      - devenv.nix
      - devenv.yaml
      - devenv.lock
      - nix/guest.nix
      - nix/guest-nixos.nix
      - nix/console-helper-pkg.nix
      - nix/image-archive.nix
      - scripts/build-guest.sh
      - src/msks/msks/**
      - src/msks/tests/conftest.py
      - src/msks/tests/test_smoke/__init__.py
      - src/msks/tests/test_smoke/*.py
      - src/msks/tests/test_smoke/core/**
  pull_request:
    paths:
      - .github/workflows/smoke-nixos.yml
      - devenv.nix
      - devenv.yaml
      - devenv.lock
      - nix/guest.nix
      - nix/guest-nixos.nix
      - nix/console-helper-pkg.nix
      - nix/image-archive.nix
      - scripts/build-guest.sh
      - src/msks/msks/**
      - src/msks/tests/conftest.py
      - src/msks/tests/test_smoke/__init__.py
      - src/msks/tests/test_smoke/*.py
      - src/msks/tests/test_smoke/core/**

permissions:
  contents: read

concurrency:
  group: smoke-nixos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-nixos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: devenv

      - name: Install devenv.sh
        run: nix profile add github:cachix/devenv/v2.3.1

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the NixOS guest assets
        run: >-
          devenv --quiet -O dotenv.enable:bool false shell --
          msks-build-guest nixos

      - name: Smoke tests
        env:
          TMPDIR: /tmp
          MSKSD_TEST_GUEST_UP_TIMEOUT_S: "180"
          MSKSD_TEST_CONSOLE_TIMEOUT_S: "120"
          MSKSD_TEST_SHUTDOWN_TIMEOUT_S: "180"
        run: |
          set -o pipefail
          G=.devenv/state/guest-nixos
          manifest="$G/guest-manifest.json"
          cmdline=$(
            python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['cmdline'])" \
              "$manifest"
          )
          devenv --quiet -O dotenv.enable:bool false shell -- env \
            MSKSD_TEST_VMLINUX="$PWD/$G/vmlinux" \
            MSKSD_TEST_INITRD="$PWD/$G/initrd" \
            MSKSD_TEST_ROOTFS="$PWD/$G/rootfs.ext4" \
            MSKSD_TEST_CMDLINE="$cmdline" \
            python -m pytest src/msks/tests/test_smoke/core \
            -v -rs -p no:cacheprovider --no-cov 2>&1 \
            | tee /tmp/smoke-nixos.log
          ! grep -q 'test_boot_lifecycle.*SKIPPED' /tmp/smoke-nixos.log \
            || {
              echo 'the NixOS boots skipped — assets or /dev/kvm regressed'
              exit 1
            }

      - name: Collect smoke state on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-nixos-evidence
          path: /tmp/msks-smoke-failed/
          if-no-files-found: ignore
          retention-days: 7
