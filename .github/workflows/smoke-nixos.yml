# The NixOS real-VM smoke suite (#250): the same unprivileged core
# suite as smoke-debian.yml, booted against the NixOS guest — the
# explicit TEST_* exports override the conftest's discovered
# Debian defaults. Its own workflow so the image's lane reports
# separately and runs in parallel with the Debian lane.
#
# #723: the lane runs as two parallel jobs over one cached guest
# build. The cold build is the long pole (the closure is all
# cache.nixos.org downloads plus msks's own pack steps of
# gigabyte-scale artifacts), and the guest is a pure function of
# its inputs — every nix file the build reads, the devenv.lock
# nixpkgs pin, the baked console-helper sources under
# src/msks/msks, and scripts/build-guest.sh itself — so
# actions/cache keys the built guest dir on exactly those. A run
# whose inputs did not change restores the dir and skips the
# build; a run after any input change rebuilds. Caches saved by
# one job are invisible to its sibling jobs in the same run, so
# a first run after a change builds in both jobs (in parallel);
# every later run restores. No restore-keys fallback exists on
# purpose: a partial hit that pairs a new kernel with an old
# rootfs would test an image no input set ever produced. The
# suite itself matches the Debian lane's shape — serial, verbose,
# guarded against a run that quietly skipped everything.
name: Smoke (NixOS)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/smoke-nixos.yml
      - devenv.nix
      - devenv.yaml
      - devenv.lock
      - nix/guest.nix
      - nix/guest-pi-extension.ts
      - nix/guest-pi-settings.json
      - nix/agent-toolchain.nix
      - nix/pi-shrinkwrap-patch.py
      - nix/pi-shrinkwrap-integrity.json
      - nix/guest-nixos.nix
      - nix/guest-nixos-configuration.nix
      - nix/image-archive.nix
      - scripts/build-guest.sh
      - src/msks/msks/**
      - src/msks/tests/conftest.py
      - src/msks/tests/test_smoke/__init__.py
      - src/msks/tests/test_smoke/*.py
      - src/msks/tests/test_smoke/core/**
      - src/msks/tests/test_smoke/egress/test_probe_e2e.py
      - src/msks/tests/test_smoke/egress/test_nixos_fold_e2e.py
      - src/msks/tests/test_smoke/egress/test_nixos_user_nix_e2e.py
  pull_request:
    paths:
      - .github/workflows/smoke-nixos.yml
      - devenv.nix
      - devenv.yaml
      - devenv.lock
      - nix/guest.nix
      - nix/guest-pi-extension.ts
      - nix/guest-pi-settings.json
      - nix/agent-toolchain.nix
      - nix/pi-shrinkwrap-patch.py
      - nix/pi-shrinkwrap-integrity.json
      - nix/guest-nixos.nix
      - nix/guest-nixos-configuration.nix
      - nix/image-archive.nix
      - scripts/build-guest.sh
      - src/msks/msks/**
      - src/msks/tests/conftest.py
      - src/msks/tests/test_smoke/__init__.py
      - src/msks/tests/test_smoke/*.py
      - src/msks/tests/test_smoke/core/**
      - src/msks/tests/test_smoke/egress/test_probe_e2e.py
      - src/msks/tests/test_smoke/egress/test_nixos_fold_e2e.py
      - src/msks/tests/test_smoke/egress/test_nixos_user_nix_e2e.py

permissions:
  contents: read

concurrency:
  group: smoke-nixos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    # 25 held the core lane alone when it ran serially behind the
    # build; this job runs the build-or-restore and the core
    # suite only.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: devenv

      - name: Install devenv.sh
        run: nix profile add github:cachix/devenv/v2.3.1

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free runner disk for the guest build
        # The guest build peaks past 12 GB on / (the nix closure,
        # the packed rootfs and archive, and their copies into
        # the guest dir), and the stock runner image ships with
        # toolchains this lane never runs. A first run after a
        # guest-input change builds without a cache to restore —
        # that is the run the stock disk could not hold (#723).
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - name: Restore the built guest
        id: guest
        uses: actions/cache@v4
        with:
          path: .devenv/state/guest-nixos
          # Every input the guest build reads (see the header): the
          # key changes on any of them and only on them, and
          # runner.arch names the building machine — the same way
          # the bare `nixos` flavor follows the host's uname. The
          # hashFiles call lives here, at step level, because a
          # workflow-level env evaluates before checkout.
          key: smoke-nixos-guest-${{ runner.arch }}-${{ hashFiles('devenv.lock', 'scripts/build-guest.sh', 'nix/guest.nix', 'nix/guest-nixos.nix', 'nix/guest-nixos-configuration.nix', 'nix/image-archive.nix', 'nix/agent-toolchain.nix', 'nix/guest-pi-extension.ts', 'nix/guest-pi-settings.json', 'nix/pi-shrinkwrap-patch.py', 'nix/pi-shrinkwrap-integrity.json', 'pyproject.toml', 'README.md', 'src/msks/msks/**') }}

      - name: Build the NixOS guest assets
        if: steps.guest.outputs.cache-hit != 'true'
        run: >-
          devenv --quiet -O dotenv.enable:bool false shell --
          msks-build-guest nixos

      - name: Smoke tests
        env:
          TMPDIR: /tmp
          TEST_GUEST_UP_TIMEOUT_S: "180"
          TEST_CONSOLE_TIMEOUT_S: "120"
          TEST_SHUTDOWN_TIMEOUT_S: "180"
        run: |
          set -eo pipefail
          G=.devenv/state/guest-nixos
          manifest="$G/guest-manifest.json"
          cmdline=$(
            python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['cmdline'])" \
              "$manifest"
          )
          devenv --quiet -O dotenv.enable:bool false shell -- env \
            TEST_VMLINUX="$PWD/$G/vmlinux" \
            TEST_INITRD="$PWD/$G/initrd" \
            TEST_ROOTFS="$PWD/$G/rootfs.ext4" \
            TEST_CMDLINE="$cmdline" \
            python -m pytest src/msks/tests/test_smoke/core \
            -v -rs -p no:cacheprovider --no-cov 2>&1 \
            | tee /tmp/smoke-nixos.log
          ! grep -q 'test_boot_lifecycle.*SKIPPED' /tmp/smoke-nixos.log \
            || {
              echo 'the NixOS boots skipped — assets or /dev/kvm regressed'
              exit 1
            }

      - name: Collect smoke state on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-nixos-core-evidence
          path: /tmp/msks-smoke-failed/
          if-no-files-found: ignore
          retention-days: 7

  # The probe e2e against the NixOS image (#424): the same
  # root+egress shape the Debian egress lane runs, against the
  # NixOS guest — the daemon boots that image unchanged, the
  # seed's CA staging rides the NixOS paths (the staged bundle
  # and the profile.local exports), and curl (an image package
  # here) verifies against the seed's bundle. The fold e2e
  # (#427) then waits out the background nixos-rebuild that
  # folds the CA into the system bundle and proves it with a
  # curl under `env -i`. The user-nix e2e (#433) proves nix
  # from the console as the unprivileged workspace user and
  # the shipped /etc/nixos chain. The pipeline runs INSIDE the
  # bash -c, which starts with default shell options — the
  # `set -eo pipefail` there is what carries a pytest failure
  # to the step's exit; the guarded grep below only catches a
  # quietly skipped run, never a failed one.
  e2e:
    runs-on: ubuntu-latest
    # The fold e2e waits out an in-guest rebuild (up to ~8 min)
    # on top of the daemon and guest boots.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: devenv

      - name: Install devenv.sh
        run: nix profile add github:cachix/devenv/v2.3.1

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free runner disk for the guest build
        # Same reclaim as the core job: a cache-miss run pays the
        # full build here too.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - name: Restore the built guest
        id: guest
        uses: actions/cache@v4
        with:
          path: .devenv/state/guest-nixos
          # The same key the core job hashes: one guest build per
          # input set, restored by whichever job lands on it.
          key: smoke-nixos-guest-${{ runner.arch }}-${{ hashFiles('devenv.lock', 'scripts/build-guest.sh', 'nix/guest.nix', 'nix/guest-nixos.nix', 'nix/guest-nixos-configuration.nix', 'nix/image-archive.nix', 'nix/agent-toolchain.nix', 'nix/guest-pi-extension.ts', 'nix/guest-pi-settings.json', 'nix/pi-shrinkwrap-patch.py', 'nix/pi-shrinkwrap-integrity.json', 'pyproject.toml', 'README.md', 'src/msks/msks/**') }}

      - name: Build the NixOS guest assets
        if: steps.guest.outputs.cache-hit != 'true'
        run: >-
          devenv --quiet -O dotenv.enable:bool false shell --
          msks-build-guest nixos

      - name: Probe e2e (root)
        run: |
          set -eo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq nftables
          G=.devenv/state/guest-nixos
          manifest="$G/guest-manifest.json"
          cmdline=$(
            python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['cmdline'])" \
              "$manifest"
          )
          IMG="$PWD/$G"
          devenv --quiet -O dotenv.enable:bool false shell -- bash -c "
          set -eo pipefail;
          sudo -n env TEST_EGRESS=1 TMPDIR=/tmp \
            GUEST_DIR='$IMG' \
            TEST_VMLINUX='$IMG/vmlinux' \
            TEST_INITRD='$IMG/initrd' \
            TEST_ROOTFS='$IMG/rootfs.ext4' \
            TEST_CMDLINE='$cmdline' \
            PATH=\"\$PATH\" HOME=/root \
            python -m pytest src/msks/tests/test_smoke/egress/test_probe_e2e.py \
            src/msks/tests/test_smoke/egress/test_nixos_fold_e2e.py \
            src/msks/tests/test_smoke/egress/test_nixos_user_nix_e2e.py \
            -v -rs -p no:cacheprovider --no-cov 2>&1 | tee /tmp/smoke-nixos-e2e.log
          "
          ! grep -q 'test_probe_e2e.*SKIPPED\|test_nixos_fold_e2e.*SKIPPED\|test_nixos_user_nix_e2e.*SKIPPED' /tmp/smoke-nixos-e2e.log

      - name: Collect smoke state on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-nixos-e2e-evidence
          path: /tmp/msks-smoke-failed/
          if-no-files-found: ignore
          retention-days: 7
