# Guest-asset build (#17, split out of ci.yml).
#
# The nix-heavy derivation check from #5's ubuntu-latest criterion:
# a cold checkout must still build the kernel/initrd/rootfs, so the
# guest-asset expressions cannot silently rot. The
# artifacts are not consumed on the runner — CH smoke needs KVM —
# which is exactly why this reports as its own check: slow and
# independent of both lint and the unit tests.
#
# Needs none of the test-run plumbing (no TMPDIR pin, no coverage
# env): just the devenv shell and the msks-build-guest script.
#
# Path-filtered: runs only when the guest inputs change — the nix
# expressions, the build script, the devenv files that pin nixpkgs
# and define the task, or this workflow itself. The trade vs. #5's
# anti-rot criterion is accepted deliberately: unrelated PRs skip
# this job (and show it as skipped), guest-touching PRs and any
# devenv pin move still build from cold.
name: Guest assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/guest-assets.yml
      - devenv.nix
      - devenv.yaml
      - devenv.lock
      - nix/guest.nix
      - nix/agent-toolchain.nix
      - nix/pi-shrinkwrap-patch.py
      - nix/pi-shrinkwrap-integrity.json
      - nix/guest-debian.nix
      - nix/guest-fedora.nix
      - nix/guest-nixos.nix
      - nix/image-archive.nix
      - nix/guest-pi-extension.ts
      - scripts/build-guest.sh
  pull_request:
    paths:
      - .github/workflows/guest-assets.yml
      - devenv.nix
      - devenv.yaml
      - devenv.lock
      - nix/guest.nix
      - nix/agent-toolchain.nix
      - nix/pi-shrinkwrap-patch.py
      - nix/pi-shrinkwrap-integrity.json
      - nix/guest-debian.nix
      - nix/guest-fedora.nix
      - nix/guest-nixos.nix
      - nix/image-archive.nix
      - nix/guest-pi-extension.ts
      - scripts/build-guest.sh

permissions:
  contents: read

concurrency:
  group: guest-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-guest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: devenv

      # Pinned release, not the moving default registry: the devenv
      # that evaluates the 2.x tasks syntax and parses -O is the one
      # moving part otherwise — an upstream break would red CI with no
      # repo change.
      - name: Install devenv.sh
        run: nix profile add github:cachix/devenv/v2.3.1

      - name: Build guest assets
        run: >-
          devenv --quiet -O dotenv.enable:bool false shell --
          msks-build-guest

      # The NixOS guest (#250): the second catalog image, built from
      # the same pinned nixpkgs the Debian guest's toolchain uses.
      # Its closure is all cache.nixos.org downloads on a cold
      # runner — the 60-minute ceiling holds, but the step sits
      # after the Debian build so a slow mirror never muddies its
      # signal.
      - name: Build the NixOS guest assets
        run: >-
          devenv --quiet -O dotenv.enable:bool false shell --
          msks-build-guest nixos

      # The Fedora 44 guest (#651): the third catalog image, the
      # btrfs-extraction fetch-and-pack build. Same anti-rot
      # criterion as the two above: a cold runner builds it end to
      # end.
      - name: Build the Fedora guest assets
        run: >-
          devenv --quiet -O dotenv.enable:bool false shell --
          msks-build-guest fedora

      # The real-artifact pinning test: the ''-escape RepoTag bug
      # shipped precisely because this test skipped everywhere CI
      # ran. The import costs ~8s against each built archive.
      - name: Import the built images (pinning test)
        run: >-
          devenv --quiet -O dotenv.enable:bool false shell --
          python -m pytest src/msks/tests/test_imagestore.py
          -q -p no:cacheprovider --no-cov
          -k real_built

  # The arm64 leg (#637): the same Debian-flavor build and import
  # pinning on GitHub's arm64 runner. The bare flavor name follows
  # the building host, so `msks-build-guest` here IS the aarch64
  # build — the same anti-rot criterion the x86_64 job holds, for
  # the other arch. The NixOS arm64 closure stays out of CI for
  # now: its cold build would own the job's whole budget, and the
  # arm64 dev host that motivated #637 builds it natively.
  build-guest-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: devenv

      - name: Install devenv.sh
        run: nix profile add github:cachix/devenv/v2.3.1

      - name: Build the arm64 guest assets
        run: >-
          devenv --quiet -O dotenv.enable:bool false shell --
          msks-build-guest

      - name: Import the built image (pinning test)
        run: >-
          devenv --quiet -O dotenv.enable:bool false shell --
          python -m pytest src/msks/tests/test_imagestore.py
          -q -p no:cacheprovider --no-cov
          -k real_built
