# Root egress smoke tests on the hosted runner (#52, #64).
#
# The egress smokes build on the KVM ones but need the host's
# network to themselves: root (tap creation, DHCP and DNS on
# privileged ports, nftables), nftables installed, and the runner's
# FORWARD chain handed to the daemon's own tables — a precondition
# step owns that below. They run as their own workflow (parallel
# with smoke.yml's unprivileged boots, separate concurrency group)
# so an egress failure neither waits behind nor re-runs the plain
# boots.
#
# What runs: test_local_egress_boot (DHCP, the daemon's resolver,
# NAT'd TCP, and the input-chain containment), test_local_sshd_and_rsync
# (sshd through the forward, persistent host keys, rsync),
# test_local_egress_git_out (#81 — substitutes in over egress, then
# a git push whose credential rode the forward as a forwarded
# agent), and test_local_minted_identity (the minted key end to
# end). Serial, explicitly listed, nested-KVM phase ceilings raised.
#
# The egress step also guards the bare-host posture — msksd's net
# stack on a kernel it shares with other firewall owners — which the
# appliance does not exercise (msksd is the only firewall in its
# kernel) and which nothing ships today: retire this step if k8s
# workspace egress (#69) settles on pod networking, keep and promote
# it if it lands on host taps — the additive appliance-side coverage
# is #88. Either way the lesson it pins is the product lesson for
# that posture: an nft accept in the daemon's own tables cannot
# override a foreign base chain's drop — on a shared kernel, host
# firewall control must be taken explicitly, the way
# appliance-setup.sh takes it for the appliance bridge. Concretely
# here: the runner's docker leaves FORWARD policy DROP for traffic
# not its own, so the precondition step prints whatever the image
# left behind, clears FORWARD, and hands the forward hook to the
# daemon's own nft tables — the rules this smoke exists to test.
# Without that, guest TCP out blackholes behind docker's policy
# while DHCP and DNS (host-terminated, input chain) pass; validated
# against a faithful FORWARD policy-drop simulation during #75. The
# runner is a per-job VM, so the flush and policy travel with it and
# touch no other workload.
name: Egress smoke (KVM)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/smoke.yml
      - .github/workflows/smoke-egress.yml
      - devenv.nix
      - devenv.yaml
      - devenv.lock
      - nix/guest.nix
      - nix/guest-assets.nix
      - scripts/build-guest.sh
      - src/msks/msks/**
      - src/msks/tests/conftest.py
      - src/msks/tests/test_smoke.py
  pull_request:
    paths:
      - .github/workflows/smoke.yml
      - .github/workflows/smoke-egress.yml
      - devenv.nix
      - devenv.yaml
      - devenv.lock
      - nix/guest.nix
      - nix/guest-assets.nix
      - scripts/build-guest.sh
      - src/msks/msks/**
      - src/msks/tests/conftest.py
      - src/msks/tests/test_smoke.py

permissions:
  contents: read

concurrency:
  group: smoke-egress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-egress:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: devenv

      # Pinned release, not the moving default registry: the devenv
      # that evaluates the 2.x tasks syntax and parses -O is the one
      # moving part otherwise — an upstream break would red CI with no
      # repo change.
      - name: Install devenv.sh
        run: nix profile add github:cachix/devenv/v2.3.1

      # The documented KVM permission rule (github.blog 2024-04-02):
      # /dev/kvm exists on the hosted runner image but is restricted;
      # this makes it 0666 for the runner user. kvm_available() then
      # passes and the conftest points the smoke tests at the built
      # .guest/ artifacts.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build guest assets
        run: >-
          devenv --quiet -O dotenv.enable:bool false shell --
          devenv tasks run msks:build-guest

      - name: Egress smoke forwarding precondition
        run: |
          echo "::group::forward/firewall state before"
          sysctl net.ipv4.ip_forward
          sudo iptables -S FORWARD || true
          sudo nft list tables || true
          echo "::endgroup::"
          sudo iptables -F FORWARD
          sudo iptables -P FORWARD ACCEPT
          sudo iptables -S FORWARD

      # Root, serial, explicit: every egress smoke boots a VM through
      # the daemon's own net stack; the list is spelled out so a new
      # egress test is a deliberate addition here. HOME=/root because
      # sudo -i semantics do not apply to `sudo -n env`; TMPDIR=/tmp
      # for the AF_UNIX path-depth reason as ci.yml; the devenv PATH
      # rides along so the tests resolve ip/nft and the scratch
      # sshd/git the git-out smoke spawns.
      - name: Egress smoke (root)
        env:
          TMPDIR: /tmp
          MSKSD_TEST_GUEST_UP_TIMEOUT_S: "180"
          MSKSD_TEST_CONSOLE_TIMEOUT_S: "120"
          MSKSD_TEST_SHUTDOWN_TIMEOUT_S: "180"
        run: >-
          sudo apt-get update -qq && sudo apt-get install -y -qq nftables &&
          devenv --quiet -O dotenv.enable:bool false shell -- bash -c "
          sudo -n env MSKSD_TEST_EGRESS=1 TMPDIR=/tmp
          MSKSD_TEST_GUEST_UP_TIMEOUT_S=180
          MSKSD_TEST_CONSOLE_TIMEOUT_S=120
          MSKSD_TEST_SHUTDOWN_TIMEOUT_S=180
          MSKSD_TEST_SSH_TIMEOUT_S=120
          MSKSD_TEST_GIT_OUT_TIMEOUT_S=900
          PATH=\"\$PATH\" HOME=/root
          python -m pytest src/msks/tests/test_smoke.py::test_local_egress_boot
          src/msks/tests/test_smoke.py::test_local_sshd_and_rsync
          src/msks/tests/test_smoke.py::test_local_egress_git_out
          src/msks/tests/test_smoke.py::test_local_minted_identity
          -q -p no:cacheprovider --no-cov"

      # The failing boot's own evidence, kept by the tests' failure
      # path (serial log, VMM log, raw vsock probe printed in the step
      # log) — the runner recycles, so /tmp/msks-smoke-failed/ is the
      # only place the guest's side of the story survives. Runs on
      # cancellation too (#75 review).
      - name: Collect smoke state on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-egress-failure-evidence
          path: /tmp/msks-smoke-failed/
          if-no-files-found: ignore
          retention-days: 7
