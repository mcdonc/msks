# CI: the macOS release surface (#740).
#
# The client and msks-setup-macos-host ship to Mac users, and no
# maintainer hand-verifies them between releases — this workflow
# is that verification. The acceptance harness
# (src/msks/tests/test_hostsetup_macos_acceptance.py) runs the
# tool's phases for real on a disposable macOS runner: real TLS
# against a local fake msksd, real launchd, the real brew
# prefix, the real client config tree — faking exactly one seam,
# vm_shell (limactl shell), the tool's only VM coupling.
#
# verify runs per-PR (path-filtered to the Mac surface), on
# main, and on manual dispatch — never on the schedule (drift
# is the weekly leg; the two never share a concurrency group,
# so a merge landing mid-run cannot cancel the weekly probe).
# drift is weekly plus manual: brew installs the current Lima
# and the parsing expectations run against the real binary, so
# upstream changes surface here instead of in a user's
# terminal. The tag run lives in release.yml (macos-acceptance)
# and installs the wheel the release just staged — the artifact
# users install.
#
# What no GitHub runner can cover: the Lima VM itself. Apple's
# VZ framework does not nest, and the arm64 runners are M1-class
# chips — the tool's own nested-virtualization gate (#676)
# refuses them by design. The first VM boot after a release
# stays on the first real M3 Mac.
name: macOS

on:
  pull_request:
    paths:
      - "src/msks/msks/client/**"
      - "src/msks/msks/server/hostsetup_macos.py"
      - "src/msks/msks/server/hostsetup.py"
      - "src/msks/msks/server/tls.py"
      - "src/msks/tests/test_hostsetup_macos*.py"
      - ".github/workflows/macos.yml"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "src/msks/msks/client/**"
      - "src/msks/msks/server/hostsetup_macos.py"
      - "src/msks/msks/server/hostsetup.py"
      - "src/msks/msks/server/tls.py"
      - "src/msks/tests/test_hostsetup_macos*.py"
      - ".github/workflows/macos.yml"
      - "pyproject.toml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event names the group: a scheduled or manual run never
  # shares a group with a push (cancel-in-progress is the PR
  # leg's economy — a stale PR run dies for its fresh push; the
  # weekly drift run must survive a merge landing mid-brew).
  group: macos-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    if: github.event_name != 'schedule'
    runs-on: macos-15
    timeout-minutes: 30
    # The runner's default TMPDIR nests deep under
    # /private/var/folders, pushing AF_UNIX socket paths past
    # the limit — the same fix ci.yml pins for its Linux runner
    # (pytest's basetemp belongs under /tmp).
    env:
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # The probe (#740): every run records the runner's answers
      # — the chip class (whether the #676 gate fires on the
      # runner itself), the OS, the brew prefix, launchd's gui
      # domain, limactl's presence — so a change in GitHub's
      # runner image shows in the log before it shows in a test
      # failure.
      - name: Record the runner
        run: |
          sysctl -n machdep.cpu.brand_string
          sw_vers
          brew --prefix
          if launchctl print "gui/$(id -u)" >/dev/null 2>&1; then
            echo "launchd gui domain answers"
          else
            echo "launchd gui domain did not answer"
          fi
          command -v limactl || echo "limactl absent (the stock-runner shape)"

      - name: Install
        run: |
          # The dev-Mac tool set the suite assumes: qemu-img for
          # the persist/resize suites' real overlays, and GNU
          # rsync (macOS ships openrsync at /usr/bin/rsync, whose
          # remote-shell argv shaping differs — the rsync suite
          # pins the GNU shape).
          brew install --quiet qemu rsync
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e .
          python -m pip install --quiet --group dev

      # Plain pytest, no coverage gate: on darwin the suite runs
      # under the platform skips (#691) — the same posture as a
      # local Mac run. The TUI wait budget rides at 30s (#776):
      # the mac runner carries the suite at several times the
      # Linux pace, and the TUI waits' 10s default has flaked
      # timeouts on loaded runs that pass on rerun — the budget
      # is time the app actually ran (each overslept park is
      # credited back), so 30s cannot mask a real hang, it only
      # stops a starved runner from spending a budget it never
      # had.
      - name: Unit tests
        env:
          MSKS_TUI_WAIT_S: "30"
        run: python -m pytest src/msks/tests --no-cov -n auto -q

      - name: Acceptance harness
        env:
          MSKS_MACOS_ACCEPTANCE: "1"
        run: >-
          python -m pytest
          src/msks/tests/test_hostsetup_macos_acceptance.py
          --no-cov -v

  drift:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e .
          python -m pip install --quiet --group dev

      # The current Lima release from brew: the version word and
      # the floor run against the real binary — the weekly drift
      # answer. The listing-schema arm runs wherever a limactl
      # carries at least one instance (a dev Mac); the weekly
      # runner carries none, and standing up a throwaway VM just
      # to populate the listing would cost a full image download
      # every week — the version word and the floor are the
      # weekly surface, the schema arm rides every dev Mac run
      # of the harness.
      - name: Install the current Lima
        run: brew install lima

      - name: Parsing against the real limactl
        env:
          MSKS_MACOS_ACCEPTANCE: "1"
        run: >-
          python -m pytest
          src/msks/tests/test_hostsetup_macos_acceptance.py
          --no-cov -v -k lima
