# Release (#564): the wheel publishes to PyPI, guest images
# publish to a hash-keyed channel, and the version release carries
# the small manifest that ties them together. Nothing publishes
# before the macOS acceptance harness passes (#896): the PyPI
# publish and the GitHub release both wait on it.
#
# Jobs, ordered so each has what it needs:
#
# 1. wheel   — build the pure wheel and sdist, and stage them
#              as the artifacts the harness, the publish, and
#              the release job read.
# 2. platform-wheels — the manylinux wheels carrying the
#              virtiofsd-as owner-exec helper (#1087), one per
#              architecture: each leg compiles nix/virtiofsd-as.c
#              with the runner's native gcc — static, on
#              ubuntu-latest (x86_64) and ubuntu-24.04-arm
#              (aarch64), no cross toolchain — drops the binary
#              into the package as msks/bin/virtiofsd-as, builds
#              the wheel around it, and retags it manylinux_2_17.
#              A matching host's pip prefers these over the pure
#              wheel; the SHASUMS the release job records covers
#              every wheel the same way.
# 3. macos-acceptance — the harness against the staged wheel
#              (#740): the wheel installed on a real macOS
#              runner, driving the acceptance tests against the
#              shipped code. Its green is the gate both
#              publishes wait on.
# 4. pypi    — publish every wheel and the sdist through the
#              registered trusted publisher (the pending
#              publisher names this file and the `pypi`
#              environment; no token lives in the repo).
# 5. release — create the version release: the changelog's
#              human-authored section (scripts/release_notes.py
#              extracts it at the tag) prepended to GitHub's
#              auto-generated notes, with every wheel, the sdist,
#              their checksums, the two one-command bootstrap
#              wrappers (#1119), and a provisional
#              manifest — the previous release's images.json —
#              attached (#659). The checksum record carries the
#              wheels' digests plus bootstrap/pinned-sums (uv and
#              the VMM, one line per arch), so the wrappers
#              verify every artifact they fetch against it. The
#              provisional keeps the channel
#              URL answering while the image legs build;
#              images-merge clobbers it with the merged manifest.
# 6. images  — the hash-keyed channel, two legs (one per arch:
#              x86_64 on ubuntu-latest, aarch64 on
#              ubuntu-24.04-arm — GitHub's arm64 runners) walking
#              that arch's flavors in order. Per flavor the nix
#              evaluation of the archive derivation — building
#              nothing — is compared against the last manifest; a
#              changed flavor builds once, compresses with
#              zstd -19 (the debian archive lands ~266 MiB, the
#              nixos one ~578 MiB — both under GitHub's 2 GiB asset
#              ceiling, which the plain nixos tar exceeds), and
#              uploads to an immutable release tagged
#              images/<hash> whose title names the flavor and arch
#              and body links what changed.
# 7. images-merge — the single manifest writer: reads both legs'
#              row artifacts (disjoint by construction — each leg
#              writes only its arch's flavors, so the merge cannot
#              race itself) and attaches images.json — ref, hash,
#              arch, description, kernel, size, url, build,
#              built_from for every flavor — to the version
#              release, so `msks image import <url>` pulls straight
#              from the channel with no manual download.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Builds and stages; talks to no registry (#896) — the pypi
  # job owns the publish, behind the harness.
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # The changelog gate, before anything publishes: a tag cut
      # without its docs/changes.md section refuses here — a live
      # PyPI package with no GitHub release is the failure this
      # ordering prevents.
      - name: Refuse a tag without its changelog section
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/release_notes.py "$TAG" > /dev/null

      # The tag↔version gate, beside the changelog's (#704): a tag
      # whose pyproject version disagrees — or still carries a
      # .dev marker — would publish a wheel no one can install by
      # name, so it refuses here, before the build.
      - name: Refuse a tag whose version disagrees or is a dev build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          tag = os.environ["TAG"].lstrip("v")
          with open("pyproject.toml", "rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          assert version == tag, f"tag {tag} != pyproject version {version}"
          assert ".dev" not in version, f"{version} carries a dev marker"
          PY

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Build the wheel and sdist
        run: |
          python -m pip install --quiet build
          python -m build

      - name: Stage the wheel for the harness and the publishes
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/
          retention-days: 1

  # The owner-exec helper's manylinux wheels (#1087): each leg
  # compiles nix/virtiofsd-as.c with the runner's native gcc —
  # static, one leg per architecture, no cross toolchain — drops
  # the binary into the package as msks/bin/virtiofsd-as, and
  # builds the wheel around it. Static glibc is exact here
  # because the helper does no NSS lookups (the uid parses
  # numerically), which is the usual static-glibc hazard; a
  # fully static payload references no external library, so the
  # manylinux_2_17 tag is compliant without auditwheel repair.
  # `--wheel` builds straight from the tree: the sdist target
  # excludes msks/bin on purpose (pyproject.toml), so an
  # sdist-derived build could never carry the binary.
  platform-wheels:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # gcc and libc6-dev (libc.a among them) ride on the runner
      # image; the compile of one small C file is seconds.
      - name: Compile the helper into the package
        run: |
          mkdir -p src/msks/msks/bin
          cc -O2 -D_FORTIFY_SOURCE=2 -fstack-protector-strong \
            -Wall -Wextra -Werror -static \
            -o src/msks/msks/bin/virtiofsd-as nix/virtiofsd-as.c
          file src/msks/msks/bin/virtiofsd-as

      - name: Build and retag the wheel
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet build wheel
          python -m build --wheel
          wheel tags --platform-tag "manylinux_2_17_$ARCH" \
            dist/msks-*-py3-none-any.whl

      # The artifact's own smoke: the binary is inside the wheel,
      # runs on this runner's arch, refuses a malformed invocation
      # exactly as the shipped helper must — and is gated fully
      # static (no interpreter, no NEEDED entries), the property
      # that makes it run on any same-arch Linux and the tag
      # claim honest.
      - name: Smoke the binary from inside the wheel
        run: |
          python - <<'PY'
          import pathlib, subprocess, zipfile
          wheel = next(pathlib.Path("dist").glob("msks-*-manylinux_2_17*.whl"))
          with zipfile.ZipFile(wheel) as zf:
              zf.extract("msks/bin/virtiofsd-as", "/tmp/wheel-smoke")
          binary = pathlib.Path("/tmp/wheel-smoke/msks/bin/virtiofsd-as")
          binary.chmod(binary.stat().st_mode | 0o111)
          probe = subprocess.run([str(binary)], capture_output=True, text=True)
          assert probe.returncode == 2, probe.stderr
          assert "usage: virtiofsd-as" in probe.stderr, probe.stderr
          elf = subprocess.run(
              ["readelf", "-d", str(binary)], capture_output=True, text=True
          ).stdout
          assert "NEEDED" not in elf, elf
          interp = subprocess.run(
              ["readelf", "-l", str(binary)], capture_output=True, text=True
          ).stdout
          assert "INTERP" not in interp, interp
          print(wheel.name, "carries a fully static, working helper")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-manylinux-${{ matrix.arch }}
          path: dist/*manylinux*.whl
          retention-days: 1
          if-no-files-found: error

  # The GitHub release waits on the harness too (#896): a red
  # harness holds every wheel, the sdist, and the provisional
  # manifest until the wheel proves it installs on a Mac.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [wheel, platform-wheels, macos-acceptance]
    permissions:
      contents: write
    steps:
      # Full history: the provisional manifest's previous-tag
      # lookup reads the tag list, and a depth-1 checkout carries
      # only this tag.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Every wheel — pure and both manylinux legs — plus the
      # sdist land in dist/, so the record step and the dist/*
      # upload below carry them with no further plumbing.
      - name: Download the wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel*
          merge-multiple: true
          path: dist/

      # The human-authored notes come first; GitHub's auto-generated
      # PR list and compare link follow. release_notes.py refuses a
      # tag whose changelog section is missing — the section is the
      # reason the file exists.
      - name: Compose the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          python scripts/release_notes.py "$TAG" > notes.md
          gh api \
            -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" \
            --jq .body > auto.md || printf '' > auto.md
          cat auto.md >> notes.md

      # The provisional manifest (#659): the previous release's
      # images.json, attached at creation so the channel URL —
      # releases/latest/download/images.json — answers from the
      # moment this release becomes latest. Without it the URL
      # 404s for the hours the image legs build, and every
      # client's image import fails. This tag's own release wins
      # when one exists (a re-run or a re-tag keeps the manifest
      # it already carries); else the newest v* tag strictly
      # below this one; else an empty list on the first release.
      - name: Fetch the provisional manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          if gh release download "$TAG" -p images.json -O images.json; then
            echo "release exists: keeping its manifest"
          elif prev_tag=$(git tag --list 'v*' --sort=-v:refname | \
                  awk -v t="$TAG" '$0==t{seen=1;next} seen{print;exit}') && \
               [ -n "$prev_tag" ] && \
               gh release download "$prev_tag" -p images.json -O images.json
          then
            echo "provisional manifest carried forward from $prev_tag"
          else
            printf '[]' > images.json
          fi

      # The checksum record the bootstrap wrappers verify
      # against (#1119): the wheels' digests plus the pinned
      # upstream artifacts — uv per arch, the VMM per arch —
      # so the one-command flow verifies every fetch. Each
      # line carries a bare asset name (#1136): a wrapper
      # fetches its second field at <release-url>/<name>, a
      # release asset downloads by its basename, and the
      # installation chapter's by-hand check runs
      # `sha256sum -c` beside the downloaded files. The hash
      # runs from inside dist/, so the directory stays out of
      # the record, and the two globs cannot match the record
      # itself.
      - name: Record the checksums
        run: |
          (cd dist && sha256sum -- *.whl *.tar.gz) > dist/SHASUMS
          cat bootstrap/pinned-sums >> dist/SHASUMS

      - name: Create the release with the wheel
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The fallback upload makes a re-run after the release
          # exists refresh the assets instead of failing at
          # create.
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file notes.md \
            --verify-tag \
            dist/* images.json \
            bootstrap/msks-setup-debian.sh \
            bootstrap/msks-setup-fedora.sh \
            || gh release upload "$TAG" dist/* images.json \
              bootstrap/msks-setup-debian.sh \
              bootstrap/msks-setup-fedora.sh --clobber

  # The gate both publishes wait on (#740, #896): the staged
  # wheel, installed on a real macOS runner, driving the
  # acceptance harness — the same one macos.yml runs per-PR,
  # against the shipped code instead of the tree. A red harness
  # holds PyPI and the GitHub release until it passes or someone
  # intervenes. The modules run from a copy outside the checkout:
  # pytest would otherwise put the checkout's src/ first on
  # sys.path, and the tree's code would shadow the wheel under
  # test. The acceptance test's sibling module copies alongside
  # it (#875's split gave it `from test_hostsetup_macos import
  # patch_phase`); the sibling imports only the wheel, pytest,
  # and the stdlib, so the pair imports cleanly there while the
  # checkout stays off sys.path, and pytest still targets the
  # acceptance file alone.
  macos-acceptance:
    runs-on: macos-15
    timeout-minutes: 30
    needs: wheel
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Download the wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist/

      - name: Install the wheel and the test runner
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet dist/*.whl pytest

      # /tmp carries no pyproject: pytest runs with no addopts —
      # no coverage flags ride along (the harness needs none).
      - name: Acceptance harness against the installed wheel
        env:
          MSKS_MACOS_ACCEPTANCE: "1"
        run: |
          mkdir -p /tmp/acceptance
          cp src/msks/tests/test_hostsetup_macos.py \
            src/msks/tests/test_hostsetup_macos_acceptance.py \
            /tmp/acceptance/
          cd /tmp
          python -m pytest acceptance/test_hostsetup_macos_acceptance.py -v

  # The PyPI publish alone behind the harness (#896): the wheel
  # job stages the artifacts, the harness proves they install,
  # and only then does the package reach PyPI. The trusted
  # publisher binds the repository, this file's name, and the
  # `pypi` environment — not the job — so the publish's move from
  # the wheel job into this one keeps the registration valid with
  # no PyPI-side change.
  pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [wheel, platform-wheels, macos-acceptance]
    permissions:
      contents: read
      id-token: write
    environment: pypi
    steps:
      # Every wheel (pure and both manylinux legs) plus the sdist:
      # the trusted publisher serves whatever dist/ holds.
      - name: Download the wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI (trusted publisher)
        uses: pypa/gh-action-pypi-publish@release/v1

  images:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    # The aarch64 leg's first NixOS build compiles the guest kernel
    # natively (the closure builds for the runner's own arch); the
    # x86_64 leg's unchanged derivations come from cache.
    timeout-minutes: 240
    needs: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      SHA: ${{ github.sha }}
      REPO: ${{ github.repository }}
      ARCH: ${{ matrix.arch }}
    steps:
      # Full history: the previous-version lookup reads the tag
      # list, and a depth-1 checkout carries only this tag.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: devenv

      - name: Install devenv.sh
        run: nix profile add github:cachix/devenv/v2.3.1

      # The manifest being replaced: this tag's own images.json
      # first — normally the provisional the release job attached
      # (#659; the previous release's manifest by construction, so
      # the comparison below behaves the same either way; a re-run
      # after images-merge finds the finished manifest and every
      # derivation reads as unchanged) — else the previous version
      # release's images.json, the newest tag strictly below this
      # one. Either way flavors whose derivation did not change
      # carry their rows — and their built_from — forward across
      # releases.
      - name: Read the previous manifest
        run: |
          set -eu
          if gh release download "$TAG" -p images.json -O published.json; then
            echo "this release carries a manifest: using it"
          elif prev_tag=$(git tag --sort=-v:refname | grep '^v' | \
                  grep -vx "$TAG" | while read -r t; do \
                    if [ "$t" = "$(printf '%s\n%s\n' "$TAG" "$t" | \
                                  sort -V | head -1)" ]; then \
                      echo "$t"; break; \
                    fi; \
                  done) && \
               [ -n "$prev_tag" ] && \
               gh release download "$prev_tag" -p images.json -O published.json
          then
            echo "carrying forward from $prev_tag's manifest"
          else
            printf '[]' > published.json
          fi
          # The published manifest is a LIST of rows (the client's
          # contract); the gate reads it keyed by flavor and arch —
          # the ref's name half plus the row's arch. A row that
          # predates the arch field (#638) was built on x86_64
          # runners, so a missing arch keys as x86_64 and carries
          # forward into that leg.
          jq 'map({key: ((.ref | split(":")[0]) + "/" + (.arch // "x86_64")),
                   value: .}) | from_entries' \
            published.json > prev.json

      # One flavor at a time: each changed flavor publishes its
      # immutable channel slot, and every flavor (changed or not)
      # leaves a row in rows.json for the final merge. The attrs are
      # the arch-pinned ones (#637): each leg evaluates and builds
      # its own arch's derivations — the NixOS closure compiles
      # natively on the matching runner, never through emulation.
      - name: Publish changed images, collect manifest rows
        run: |
          set -eu
          printf '{}' > rows.json
          for flavor in debian fedora nixos; do
            dir=.devenv/state/guest
            attr="guest-$ARCH"
            if [ "$flavor" = fedora ]; then
              dir=.devenv/state/guest-fedora
              attr="guest-fedora-$ARCH"
            fi
            if [ "$flavor" = nixos ]; then
              dir=.devenv/state/guest-nixos
              attr="guest-nixos-$ARCH"
            fi
            # The single quotes are the point: the devenv shell's
            # environment expands GUEST_NIXPKGS inside the inner
            # bash, where it lives.
            # shellcheck disable=SC2016
            build=$(devenv --quiet -O dotenv.enable:bool false shell -- \
              bash -c 'nix eval --raw -I nixpkgs="$GUEST_NIXPKGS" \
                -f nix/guest.nix "$1.imageArchive.outPath"' \
              bash "$attr" \
              | xargs basename)
            key="$flavor/$ARCH"
            prev_build=$(jq -r --arg k "$key" '.[$k].build // empty' prev.json)
            prev_row=$(jq -c --arg k "$key" '.[$k] // empty' prev.json)
            if [ "$build" = "$prev_build" ] && [ -n "$prev_row" ]; then
              echo "$flavor: derivation unchanged ($build) — row carries forward"
              jq --arg k "$key" --argjson row "$prev_row" \
                '.[$k] = $row' rows.json > rows.json.new
              mv rows.json.new rows.json
              continue
            fi
            echo "$flavor: derivation changed — building"
            # #771: a failed nix-build prints the failing
            # derivation's whole build log inline, and the NixOS
            # kernel compile is tens of thousands of lines — the
            # step log drowned. The build's output lands in a file
            # instead: success prints one line, failure prints the
            # last 80 lines (the compiler error sits at the log's
            # end) and the step artifact below ships the whole
            # file.
            log="build-$flavor-$ARCH.log"
            if devenv --quiet -O dotenv.enable:bool false shell -- \
                 msks-build-guest "$flavor" >"$log" 2>&1; then
              echo "$flavor: built ($log: $(wc -l <"$log") lines)"
              rm -f "$log"
            else
              echo "::error title=$flavor build failed::the error lines and the last 80 log lines follow; the full log ships as this job's build-logs artifact"
              grep -n "error:" "$log" | tail -3
              tail -n 80 "$log"
              exit 1
            fi
            zstd -19 -T0 -q "$dir/$(cat "$dir/image-archive-name")" \
              -o "$flavor.tar.zst"
            hash=$(sha256sum "$flavor.tar.zst" | cut -d' ' -f1)
            short=${hash:0:12}
            tag="images/$short"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$flavor: channel slot $tag already published"
            else
              prev_from=$(jq -r --arg k "$key" \
                '.[$k].built_from // empty' prev.json)
              # Prerelease: GitHub's releases/latest skips
              # prereleases, so the hash-keyed channel slots can
              # never displace the version release the default
              # manifest URL (releases/latest/download) points at.
              gh release create "$tag" \
                --prerelease \
                --target "$SHA" \
                --title "$flavor $ARCH image ($short)" \
                --notes "Built from $SHA. What changed: https://github.com/$REPO/compare/${prev_from:-$SHA}...$SHA" \
                "$flavor.tar.zst#$flavor.tar.zst" \
                || gh release upload "$tag" \
                  "$flavor.tar.zst#$flavor.tar.zst" --clobber
            fi
            meta=$(devenv --quiet -O dotenv.enable:bool false shell -- \
              python scripts/image_meta.py "$dir")
            jq \
              --arg k "$key" \
              --arg arch "$ARCH" \
              --arg hash "$hash" \
              --arg url "https://github.com/$REPO/releases/download/$tag/$flavor.tar.zst" \
              --arg build "$build" \
              --arg sha "$SHA" \
              --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --argjson size "$(stat -c%s "$flavor.tar.zst")" \
              --argjson meta "$meta" \
              '.[$k] = {ref: $meta.ref, description: $meta.description,
                        kernel: $meta.kernel_version, arch: $arch,
                        hash: $hash,
                        size: $size, url: $url, build: $build,
                        built_from: $sha, built_at: $built_at}' \
              rows.json > rows.json.new
            mv rows.json.new rows.json
          done

      - name: Stage this leg's rows for the merge
        # The file must carry the arch INSIDE the artifact
        # (merge-multiple on the merge side flattens every
        # artifact into one directory — two artifacts whose inner
        # file is both rows.json collide, and the v0.4 merge glob
        # found nothing). Each leg's copy is one local rename.
        run: cp rows.json "rows-${ARCH}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: rows-${{ matrix.arch }}
          path: rows-${{ matrix.arch }}.json
          retention-days: 1
      # #771: the captured build logs (the kernel compile among
      # them) ride along when a flavor failed or the job was
      # cancelled — a timeout cancels through this gate too
      # (failure() alone skips the cancellation path), and the
      # log written up to the kill is exactly the evidence the
      # 240-minute aarch64 kernel build would want.
      - name: Ship the build logs on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.arch }}
          path: build-*.log
          retention-days: 7
          if-no-files-found: ignore

  # The final manifest writer: the legs publish disjoint row
  # sets (each arch's flavors under flavor/arch keys), and this
  # job is the only one that writes the merged manifest — the
  # no-race property the single job held, moved up one level.
  # The --clobber replaces the provisional manifest the release
  # job attached (#659).
  images-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: images
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - name: Download both legs' rows
        uses: actions/download-artifact@v4
        with:
          pattern: rows-*
          merge-multiple: true
          path: rows/

      # Each leg's artifact carries its rows keyed by flavor/arch;
      # jq -s add unions the objects, [.[]] flattens to the list
      # the client imports. The floor of two rows is the shape
      # check: one row per flavor per arch. The upload names the
      # repository explicitly: this job checks nothing out, so gh
      # cannot resolve one from a git remote.
      - name: Attach images.json to the version release
        run: |
          set -eu
          jq -s 'add | [.[]]' rows/rows-*.json > images.json
          test "$(jq length images.json)" -ge 2 \
            || { echo "merged manifest is unexpectedly small"; exit 1; }
          gh release upload "$TAG" images.json --clobber --repo "$REPO"
