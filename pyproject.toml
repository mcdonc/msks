[project]
name = "msks"
version = "0.1.0"
description = "Microvm workspace daemon (klangkd analogue on cloud-hypervisor)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.14",
  "cryptography>=44",
  "fastapi>=0.115",
  "httpx>=0.28",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "uvicorn[standard]>=0.32",
  "websockets>=14",
  # The egress interceptor's engine (#199): embedded in-process,
  # one master for every workspace, per-tap listeners. The footprint
  # the #194 spike vetted: 35 packages on top of the project's 44,
  # including the cryptography bump 48 → 50 (within the >=44 floor);
  # nix/msks-pkg.nix mirrors it from the pinned nixpkgs (12.2.3, the
  # version the spike ran). The <13 ceiling holds the integration to
  # the 12.x internals it leans on (addon-before-defaults ordering,
  # tls_start_client's set_accept_state, mode-spec dispatch) — lift
  # it only alongside a re-run of the spike's gates.
  "mitmproxy>=12.2,<13",
  # The LLM router's multi-provider mode (#259, ported from
  # klangk): imported lazily inside msks.llm so the ~5 s import
  # tax stays off every path that never configures a model list —
  # the CLI, the TUI, an unconfigured daemon. The <2 ceiling holds
  # the allowlist posture to the 1.x kwargs semantics it was
  # reviewed against (call-site api_base/api_key overrides) — lift
  # it only alongside a re-review of CHAT_FIELDS.
  "litellm>=1.86,<2",
  # Egress consent's NFQUEUE binding (#69): consent is the normal
  # posture for workspaces, so the binding ships with every
  # install. It links libnetfilter_queue — devenv carries the
  # library for dev/CI shells, and nix/msks-pkg.nix ships the
  # binding in the msksd package; the import stays guarded so
  # an exotic install without the library fails closed at attach
  # with a named refusal, never silently.
  "netfilterqueue>=0.9",
  "textual>=8.2.8",
  # The listings' and help's measured columns (#271): textual
  # already ships it, but the CLI imports it directly on every
  # path — the dependency is msks's own, declared here so a
  # textual pin change cannot silently drop it.
  "rich>=13",
  # The command tree (#315): typer renders the help screens and
  # carries the flags; the pinned floor is the envvar= era the
  # client's option declarations target.
  "typer>=0.12",
]

[dependency-groups]
dev = [
  "coverage[toml]",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-timeout",
  "pytest-testmon",
  "pytest-xdist",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
msks = "msks.client.cli:main"
msksd = "msks.server.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/msks/msks"]

[tool.pytest.ini_options]
# Library-internal deprecations our code paths cannot fix (last-resort
# filters, house rules): starlette's TestClient wants httpx2 and anyio
# renamed BlockingPortal — both fire inside fastapi.testclient imports,
# not in msks code. Revisit when starlette ships httpx2 support. The
# mitmproxy pair fires inside ITS imports (ldap3's pyasn1 bridge,
# pyparsing's old spelling in flowfilter) the moment the interceptor
# module loads — unreachable from msks sources until mitmproxy moves.
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated",
  "ignore::DeprecationWarning:ldap3.utils.asn1",
  "ignore::pyparsing.warnings.PyparsingDeprecationWarning",
]
# Coverage rides in addopts so the plain CI invocation (`python -m pytest
# src/msks/tests -v -n auto`) is the gated one; scoped runs pass
# --no-cov (see the `testmon` devenv task).
# The per-test ceiling (#157): a suite that stalls at a test fails
# there, named, within seconds of the ceiling -- instead of a wall of
# dots ending in silence while the CI budget burns (the #151 incident:
# 25/69 tests in 600s, all "passing"). 30s is generous against a
# healthy local average near 1s; the smoke suite (real VM boots)
# carries its own ceiling via its conftest. --durations=10
# names the slowest tests on EVERY run, before a second diagnostic
# run has to be paid for.
addopts = "--cov=msks --cov-branch --cov-report=term-missing -ra --timeout=30 --durations=10"
asyncio_mode = "auto"
testpaths = ["src/msks/tests"]

[tool.coverage.run]
branch = true
source = ["msks"]
# No `concurrency` option: the suites pin COVERAGE_CORE=sysmon in
# conftest.py (sys.monitoring on 3.14 measures branches and tracks
# greenlet-executed code natively); sysmon does not support concurrency.

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
target-version = "py314"
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
