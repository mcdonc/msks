# one more name — covers moved home to the ports vocabulary beside
# ports_for (#452), so the interceptor's web gate reads it from the leaf
spec = 26

[snapshot.persist]
identity = 2
spec = 4

[snapshot.secretstore]
model = 2

[snapshot.server]
app = 2
# #464: msksd doctor reads the daemon's own tool-name settings
# (load_settings) beside serve's — the checks name what the
# daemon will actually exec.
config = 4
events = 4
identity = 8
# #448: the lifespan runs the catalog's startup sweep itself (the
# seed bootstrap imports beside the default's, and debris from
# either must clear whichever setting pointed at it). #470: the
# workspace listing joins the catalog — each row's image
# reference resolves through the imagestore (resolve_hash beside
# the listing's aliased list_images).
imagestore = 29
llm = 2
microvm = 10
model = 7
persist = 12
# #423 follow-up: the mint takes the operator's value again, so
# the route dropped its new_secret_value import (the minter
# itself is gone with it).
