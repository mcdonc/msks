# The import-graph gates' config (AGENTS.md, "Import-graph gates").
# Rule plus config: scripts/check_import_graph.py enforces these
# entries over the same AST walk scripts/check_import_cycles.py
# performs, at commit time (the generated pre-commit hook), in
# msks-preflight, and in the suite (src/msks/tests/
# test_import_graph.py). Widening anything below is a deliberate
# edit: the diff states why.

# Ceiling of distinct importers per module; only goes down. The
# current record holder is msks.client.env (11); #416 split the
# failure class out of msks.spec.vm (14 importers then, 7 now),
# so the ceiling steps down from 14 to 12.
fan_in_ceiling = 12

# Production entry points (pyproject [project.scripts] plus the
# standalone conformance entry `python -m msks.conformance`). Every
# module under src/msks/msks must be reachable from these.
entry_points = [
  "msks.server.main",
  "msks.server.hostsetup",
  # #635: the Fedora sibling entry — its module carries only the
  # HostProfile; the shared phases live in hostsetup beside it.
  "msks.server.hostsetup_fedora",
  # #676: the macOS host setup — the tool that creates the msksd
  # Lima VM from the shipped template and bootstraps the daemon
  # inside it.
  "msks.server.hostsetup_macos",
  "msks.client.cli",
  "msks.client.term_popup",
  "msks.client.tui.decide_app",
  "msks.conformance",
]

# Re-export surfaces: modules whose re-exported names may be
# imported from elsewhere. Each entry re-exports at least one name.
# msks.client.context (#418): the command groups' connection
# seam — the env readers bound beside the call shapes, so the
# four groups import one module instead of pushing
# msks.client.env past the fan-in ceiling.
facades = [
  "msks.client.context",
  "msks.client.tui.consent_ui",
  "msks.interceptor",
  "msks.microvm",
  # #874: the local driver split into a package (console, procs,
  # config, fsproc, driver); the composer and the console API keep
  # importing LocalCloudHypervisor and close_console_stream through
  # the package root.
  "msks.microvm.local",
  # #874: the client config module split its validator and
  # template out; the mac setup and the CLI keep importing
  # parse_config_doc and bootstrap through the module they
  # always did.
  "msks.client.config",
  # #874: the workspace page split into a package (lines, actions,
  # screen); the main screen and app keep importing the page's
  # surface through the package root.
  "msks.client.tui.workspace",
  "msks.microvm.errors",
  "msks.model",
  "msks.net",
  # #874: the LLM proxy split into a package (indirect, entries,
  # router, anthropic, proxy); the composer and the interceptor's
  # probe keep importing the surfaces they always did (LlmProxy,
  # TapListener) through the package root.
  "msks.llm",
  # #874: the Debian host setup split into a package (util,
  # profile, packages, wrapper, kernel, users, links, unit, run);
  # doctor and the Fedora sibling keep importing the names they
  # always did through the package root.
  "msks.server.hostsetup",
]

# Package-level cycles the DAG gate exempts. The module-level graph
# is acyclic regardless; an exemption whose pair stops cycling both
# ways fails as stale, so this list only shrinks. The list is empty
# since #411 moved EventHub to the events root leaf and dropped the
# last package cycle (app <-> server); a new entry needs a shared-leaf
# extraction first and a reason here.
[exempt_pairs]

# Layer ranks: every cross-package import runs from a higher rank
# to a lower one. Rank 0 is the shared-leaf vocabulary and the
# root modules nothing imports; server pulls the composer (app)
# at its entry point, and conformance — the local checker —
# composes the daemon, so it sits on top.
[ranks]
agecrypto = 0
configio = 0
conformance_args = 0
events = 0
# #672: the daemon-side host-share gates — a leaf over the mount
# vocabulary (the mounted-roots enumeration and the two-gate
# validation), sitting at settings' rank.
hostshares = 1
identity = 0
llm = 0
msks = 0
# #808: the workspace proxy subsystem — the persisted forward and
# remote TCP listeners the daemon owns; a root leaf the composer
# and the net manager (by attribute) reach.
proxies = 0
# #514: the unlock-time plaintext cache + the named locked error
# — a leaf the interceptor, the store, and the API all reach.
secretcache = 0
spec = 0
storage = 0
client = 1
imagestore = 1
interceptor = 1
model = 1
net = 1
persist = 1
settings = 1
config = 2
consent = 2
microvm = 2
secretstore = 2
app = 3
server = 4
conformance = 5

# Exact cross-package import-statement counts, per pair. A count
# that grows or shrinks fails until this file is updated in the
# same commit — re-coupling is always a deliberate edit.
[snapshot.app]
consent = 4
events = 2
