# vocabulary) to the same edge.
agecrypto = 4
# #514: the store owns the unlock-time plaintext cache and
# raises the mint's named refusal (module + two names).
secretcache = 3

[snapshot.server]
app = 2
# #464: msksd doctor reads the daemon's own tool-name settings
